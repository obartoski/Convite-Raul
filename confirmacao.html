<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5f0f18">
  <title>Resposta de teste — Raul Tomaz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=17">
</head>
<body>
  <main class="page-shell response-page">
    <section class="invite-frame response-frame" aria-labelledby="responseTitle">
      <div class="velvet-surface"></div>
      <div class="frame-shadow"></div>
      <article class="paper-card response-paper">
        <div class="paper-texture"></div>
        <div class="paper-crease crease-v"></div>
        <div class="paper-crease crease-h"></div>
        <div class="response-content">
          <div class="response-seal"><img src="assets/selo-cera-raul.png" alt="Selo Raul Tomaz"></div>
          <p class="response-eyebrow">RAUL TOMAZ PRESENTS</p>
          <span class="response-line" aria-hidden="true"></span>
          <p class="response-status" id="responseStatus">PRÉVIA DE CONFIRMAÇÃO</p>
          <h1 class="response-title" id="responseTitle">Tudo pronto.</h1>
          <p class="response-description" id="responseDescription">Esta página demonstra como a resposta aparecerá após o envio.</p>
          <div class="response-summary" id="responseSummary" hidden>
            <span>RESPOSTA SELECIONADA</span>
            <strong id="responseSelected"></strong>
          </div>
          <p class="preview-warning" id="previewWarning">TESTE VISUAL · Sua resposta ainda não foi registrada em planilha.</p>
          <a class="response-back" href="index.html">VOLTAR AO CONVITE <span aria-hidden="true">↗</span></a>
        </div>
      </article>
    </section>
  </main>
  <script src="confirmacao.js?v=17"></script>
</body>
</html>
